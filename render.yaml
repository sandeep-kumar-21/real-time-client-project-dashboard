services:
  # Express.js Backend Web Service
  - type: web
    name: velozity-dashboard-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: velozity-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # Set to Vercel deployment URL

  # Redis Key-Value Store for BullMQ Queues
  - type: redis
    name: velozity-redis
    plan: starter
    ipAllowList: []

databases:
  # Managed PostgreSQL 16
  - name: velozity-postgres
    plan: starter
    databaseName: velozity_db
    user: velozity_user

