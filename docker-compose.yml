services:
  # 1. PostgreSQL 16
  postgres:
    image: postgres:16
    container_name: velozity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-velozity_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velozity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 for BullMQ Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: velozity-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Express API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: velozity-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-velozity_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-c8e9b10f2d4e8a7195b0c74e89f1d0a5b2e6c8f3a9e1d5b7c0e8a2f4d6b9c1e3}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-7b4e9f1a2c5d8e0b3c6f9a1e4d7b0c2e5f8a1b4d7c0e3f6a9b2d5e8c1f4a7b0d}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY_DAYS: 7
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Vite React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: velozity-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
